name: Feature request
description: Suggest an idea or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: What problem would this solve?, description: Describe the situation, not only the solution. }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: What would you like revu to do? }
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes: { label: Alternatives you considered }
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I would be willing to work on this
