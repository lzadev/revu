name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels the runs it makes obsolete; runs on main are never cancelled
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Run tests
        shell: bash
        run: npm test 2>&1 | tee test-output.txt
      - name: Summarize tests
        if: always()
        shell: bash
        run: |
          # grep exits 1 when nothing matches (no failing tests): that must not fail this step
          { grep -E '^# (tests|pass|fail|cancelled|skipped)' test-output.txt || true; } | while read -r l; do echo "::notice title=tests::$l"; done
          # one annotation per failing test, with the first lines of its error (newlines encoded as %0A)
          awk '/^not ok/ {if (blk!="") print blk; blk=$0; n=0; next} blk!="" && /^(ok |# )/ {print blk; blk=""; next} blk!="" && n<8 && /(error|expected|actual|code:|message|Error|at )/ {gsub(/^[ \t]+/,""); blk=blk "%0A" substr($0,1,220); n++} END {if (blk!="") print blk}' test-output.txt | head -20 | while read -r l; do echo "::error title=failing test::$l"; done

  windows:
    name: Windows (experimental)
    runs-on: windows-latest
    timeout-minutes: 20
    continue-on-error: true   # Windows is not verified yet: this job collects signal without failing the build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run tests (each test limited to 2 minutes so a hang is reported instead of blocking)
        shell: bash
        run: node --test --test-timeout=120000 "test/*.test.js" 2>&1 | tee test-output.txt
      - name: Summarize tests
        if: always()
        shell: bash
        run: |
          # grep exits 1 when nothing matches (no failing tests): that must not fail this step
          { grep -E '^# (tests|pass|fail|cancelled|skipped)' test-output.txt || true; } | while read -r l; do echo "::notice title=tests::$l"; done
          # one annotation per failing test, with the first lines of its error (newlines encoded as %0A)
          awk '/^not ok/ {if (blk!="") print blk; blk=$0; n=0; next} blk!="" && /^(ok |# )/ {print blk; blk=""; next} blk!="" && n<8 && /(error|expected|actual|code:|message|Error|at )/ {gsub(/^[ \t]+/,""); blk=blk "%0A" substr($0,1,220); n++} END {if (blk!="") print blk}' test-output.txt | head -20 | while read -r l; do echo "::error title=failing test::$l"; done

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --audit-level=high
