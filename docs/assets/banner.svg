<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="revu: AI code review on every commit">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#1b1233"/></linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a371f7"/><stop offset="1" stop-color="#58a6ff"/></linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.7"><stop offset="0" stop-color="#a371f7" stop-opacity="0.35"/><stop offset="1" stop-color="#a371f7" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1280" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="18" fill="url(#glow)"/>
  <rect x="80" y="86" width="132" height="132" rx="30" fill="url(#mark)"/>
  <path d="M112 152 L140 182 L188 118" fill="none" stroke="#0d1117" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="246" y="176" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="112" font-weight="800" fill="#f0f6fc" letter-spacing="-3">revu</text>
  <text x="250" y="222" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" fill="#c9d1d9">AI code review on every commit. Your rules. Any LLM.</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="600">
    <rect x="250" y="248" width="176" height="38" rx="19" fill="#1f2a44" stroke="#3b4a72"/><text x="338" y="273" text-anchor="middle" fill="#79c0ff">runs locally</text>
    <rect x="440" y="248" width="196" height="38" rx="19" fill="#1f3a2c" stroke="#2f6b4a"/><text x="538" y="273" text-anchor="middle" fill="#7ee787">secrets stay put</text>
    <rect x="650" y="248" width="170" height="38" rx="19" fill="#3a2a44" stroke="#6b4a8a"/><text x="735" y="273" text-anchor="middle" fill="#d2a8ff">any LLM</text>
    <rect x="834" y="248" width="176" height="38" rx="19" fill="#3a3220" stroke="#8a6f2f"/><text x="922" y="273" text-anchor="middle" fill="#e3b341">open source</text>
  </g>
  <g font-family="SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" fill="#8b949e" opacity="0.9">
    <text x="900" y="96">$ git commit</text>
    <text x="900" y="124" fill="#ff7b72">  BLOCKED · 1 issue</text>
    <text x="900" y="152" fill="#7ee787">$ revu fix</text>
    <text x="900" y="180" fill="#7ee787">  fixed · staged</text>
  </g>
