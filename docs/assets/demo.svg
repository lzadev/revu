<text x="450" y="32" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#8b949e">revu — pre-commit review</text>
<text x="34" y="88" font-family="SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" xml:space="preserve"><tspan fill="#7ee787">$ </tspan><tspan fill="#f0f6fc">git commit -m "feat: add orders screen"</tspan></text>
<text x="34" y="109" font-family="SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" xml:space="preserve"><tspan fill="#8b949e">revu › </tspan><tspan fill="#8b949e">Reviewing 2 file(s) with claude…</tspan></text>
<text x="34" y="151" font-family="SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" xml:space="preserve"><tspan fill="#d2a8ff">━━ SUMMARY </tspan><tspan fill="#d2a8ff">━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</tspan></text>
<text x="34" y="172" font-family="SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" xml:space="preserve"><tspan fill="#8b949e">2 file(s) · </tspan><tspan fill="#7ee787">+34</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#ff7b72">−3</tspan><tspan fill="#8b949e"> · claude · claude-sonnet-5 · 3.3k in / 0.9k out · ≈$0.03 · 21s</tspan></text>
<text x="34" y="214" font-family="SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" xml:space="preserve"><tspan fill="#ff7b72">━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</tspan></text>
<text x="34" y="235" font-family="SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" xml:space="preserve"><tspan fill="#ff7b72">● </tspan><tspan fill="#f0f6fc"> CRITICAL </tspan><tspan fill="#8b949e">  1/2  </tspan><tspan fill="#8b949e">bug</tspan></text>
<text x="34" y="256" font-family="SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" xml:space="preserve"><tspan fill="#ff7b72">Missing await on res.json()</tspan></text>
<text x="34" y="277" font-family="SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" xml:space="preserve"><tspan fill="#79c0ff">▸ </tspan><tspan fill="#79c0ff">src/orders.js:4</tspan></text>
<text x="34" y="319" font-family="SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" xml:space="preserve"><tspan fill="#79c0ff">Code</tspan></text>
<text x="34" y="340" font-family="SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" xml:space="preserve"><tspan fill="#8b949e">    3 │   if (!res.ok) throw new Error(`Failed: ${res.status}`);</tspan></text>
<text x="34" y="361" font-family="SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#f0f6fc">▶ 4 │   const data = res.json();</tspan></text>
<text x="34" y="382" font-family="SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" xml:space="preserve"><tspan fill="#8b949e">    5 │   return data.orders.map(o =&gt; o.total);</tspan></text>
<text x="34" y="424" font-family="SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" xml:space="preserve"><tspan fill="#ff7b72">What's wrong</tspan></text>
<text x="34" y="445" font-family="SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" xml:space="preserve"><tspan fill="#c9d1d9">   res.json() returns a Promise, so data.orders is undefined</tspan></text>
<text x="34" y="466" font-family="SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" xml:space="preserve"><tspan fill="#c9d1d9">   and line 5 throws a TypeError on every call.</tspan></text>
<text x="34" y="508" font-family="SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" xml:space="preserve"><tspan fill="#7ee787">How to fix it</tspan></text>
<text x="34" y="529" font-family="SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" xml:space="preserve"><tspan fill="#ff7b72">   - const data = res.json();</tspan></text>
<text x="34" y="550" font-family="SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" xml:space="preserve"><tspan fill="#7ee787">   + const data = await res.json();</tspan></text>
<text x="34" y="592" font-family="SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" xml:space="preserve"><tspan fill="#ff7b72">━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</tspan></text>
<text x="34" y="613" font-family="SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" xml:space="preserve"><tspan fill="#ff7b72">BLOCKED · 2 blocking issue(s)</tspan></text>
